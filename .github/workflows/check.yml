name: Compile check
on:
  push:
    branches-ignore: [ main ]
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Compile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon compileReleaseJavaWithJavac 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Show errors
        if: failure()
        working-directory: android
        run: grep -E "error:|\.java:[0-9]+" build.log | head -60
