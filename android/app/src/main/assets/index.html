<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style><title>Risk Ledger</title>
<style>@font-face{font-family:"Figtree";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/figtree-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/figtree-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/figtree-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/figtree-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2")}
</style>
<style>
/* Layout: one narrow column, summary first; fixed bottom tab bar; full-screen sheets for forms */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --line:#e3e6ec; --ink:#14171f; --ink-2:#5b6272; --ink-3:#8b92a1;
  --accent:#0f8a5f; --accent-soft:#e2f4ec; --up:#0f8a5f; --up-soft:#e2f4ec; --down:#c8372d; --down-soft:#fbe7e5; --warn:#a86400; --warn-soft:#fdf0db;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1015; --surface:#171a21; --line:#262a34; --ink:#eef0f4; --ink-2:#a3a9b6; --ink-3:#6f7584;
  --accent:#3ccf91; --accent-soft:#12291f; --up:#3ccf91; --up-soft:#12291f; --down:#ff7a6e; --down-soft:#331816; --warn:#f0a63a; --warn-soft:#2e2312; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#171a21; --line:#262a34; --ink:#eef0f4; --ink-2:#a3a9b6; --ink-3:#6f7584;
  --accent:#3ccf91; --accent-soft:#12291f; --up:#3ccf91; --up-soft:#12291f; --down:#ff7a6e; --down-soft:#331816; --warn:#f0a63a; --warn-soft:#2e2312; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%;overscroll-behavior-y:contain}
#view{will-change:transform}
#view.ptr-back{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#view.swipe-anim{transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s ease}
body{overflow-x:hidden}
#ptr{position:fixed;left:0;right:0;top:0;height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:4;pointer-events:none;overflow:hidden}
#ptr svg{width:30px;height:30px;flex:none}
#ptr .trk{stroke:var(--line)}
#ptr .arc{stroke:var(--accent);transition:stroke-dashoffset .05s linear}
#ptr .lbl{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
#ptr.ready .lbl{color:var(--accent)}
#ptr.spin svg{animation:ptrrot 1.1s linear infinite}
#ptr.spin .arc{transition:none;animation:ptrdash 1.4s ease-in-out infinite}
@keyframes ptrrot{to{transform:rotate(360deg)}}
@keyframes ptrdash{0%{stroke-dasharray:2 70;stroke-dashoffset:0}50%{stroke-dasharray:46 70;stroke-dashoffset:-12}100%{stroke-dasharray:46 70;stroke-dashoffset:-69}}
@media (prefers-reduced-motion:reduce){#ptr.spin svg,#ptr.spin .arc{animation-duration:3s}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px 150px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;justify-content:space-between;padding-top:6px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--ink-3);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:.02em;background:var(--accent-soft);color:var(--accent)}
.chip.up{background:var(--up-soft);color:var(--up)} .chip.down{background:var(--down-soft);color:var(--down)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.mute{background:var(--line);color:var(--ink-2)}
.label{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.up{color:var(--up)} .down{color:var(--down)}
/* hero */
.hero{display:flex;flex-direction:column;gap:2px;padding:18px 16px 8px}
.hero .bal{font-size:38px;font-weight:500;line-height:1.1;margin-top:4px}
.hero .bal small{font-size:15px;color:var(--ink-3);font-family:var(--f-ui);font-weight:600;margin-left:6px}
.hero .delta{font-size:14px;font-weight:600}
.spark{position:relative;margin:10px -4px 0;height:96px}
.spark svg{display:block;width:100%;height:100%;overflow:visible}
.spark .tip{position:absolute;top:-6px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:3px 7px;border-radius:6px;pointer-events:none;white-space:nowrap}
/* banner */
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.banner b{color:var(--accent)}
/* rows */
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--ink-2);font-size:14px}
.kv .v{font-size:15px;font-weight:500;text-align:right}
.next{display:flex;flex-direction:column;gap:10px}
.next .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.next .big .num{font-size:26px;font-weight:500}
/* stat grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:13px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* funnel */
.funnel{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.frow{display:grid;grid-template-columns:38px 1fr 54px;align-items:center;gap:10px}
.frow .t{font-weight:600;font-size:13px}
.bar{position:relative;height:10px;background:var(--line);border-radius:5px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px;min-width:2px}
.bar .be{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
.frow .p{text-align:right;font-size:13.5px}
.note{font-size:13px;color:var(--ink-2);margin-top:12px}
.verdict{margin-top:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cmp div{display:flex;flex-direction:column;gap:2px}
.cmp .num{font-size:17px}
.cmp .on{color:var(--accent)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* trades */
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.trow:first-child{border-top:0}
.trow:active{background:var(--bg)}
.trow .pair{font-weight:600;display:flex;gap:8px;align-items:center;min-width:0}
.trow .r{text-align:right;font-weight:500}
.trow .sub{font-size:12.5px;color:var(--ink-3)}
.trow .sub.rt{text-align:right}
.dir{font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:5px}
.dir.L{background:var(--up-soft);color:var(--up)} .dir.S{background:var(--down-soft);color:var(--down)}
.empty{text-align:center;color:var(--ink-2);padding:36px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
/* buttons */
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;font-size:15px;cursor:pointer;background:var(--accent);color:var(--surface);width:100%}
.btn.ghost{background:var(--line);color:var(--ink)}
.btn.danger{background:var(--down-soft);color:var(--down)}
.btn.sm{width:auto;padding:8px 12px;font-size:13.5px;border-radius:10px}
.caprow{align-items:center}
.levchips{display:flex;gap:8px;margin-top:-6px}
.levchips button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:10px;padding:8px 0;font-weight:600;font-size:13.5px;font-family:var(--f-num);cursor:pointer}
.levchips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.caprow .v{display:flex;align-items:center;gap:12px}
.caprow .btn{font-family:var(--f-ui)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(80px + env(safe-area-inset-bottom,0px));border:0;border-radius:16px;background:var(--accent);color:var(--surface);font-weight:700;padding:15px 20px;font-size:15px;box-shadow:0 6px 20px rgba(10,60,40,.28);cursor:pointer;z-index:5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav.tabs .in{display:flex;max-width:520px;width:100%}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-3);cursor:pointer;white-space:nowrap;letter-spacing:-.01em}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
/* sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet .wrap{padding-bottom:40px}
.sheet header{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}
.sheet header h2{font-size:18px;margin:0;flex:1}
.calc-card{padding-top:0}
.calc-card header{display:flex;flex-wrap:wrap;align-items:center;gap:6px;position:sticky;top:0;background:var(--surface);padding:14px 0 12px;margin-bottom:12px;border-bottom:1px solid var(--line);z-index:2}
.calc-card header h2{font-size:17px;margin:0;flex:1}
/* floating card: the calculator sits over the dashboard */
.sheet.float{background:rgba(8,10,16,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));overflow:hidden}
.sheet.float .wrap{background:var(--surface);border:1px solid var(--line);border-radius:22px;width:100%;max-width:520px;max-height:80%;overflow-y:auto;padding:4px 16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35);margin:0}
.sheet.float header{background:var(--surface);flex-wrap:wrap;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sheet.float .field input,.sheet.float .field select{background:var(--bg)}
.sheet.float .card.preview{background:var(--bg)}
.sumline{flex-basis:100%;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sumline .big{font-family:var(--f-num);font-size:22px;font-weight:600;color:var(--accent);white-space:nowrap}
.sumline .sub{font-size:12.5px;color:var(--ink-3);text-align:right;min-width:0}
@media (prefers-reduced-motion:no-preference){.sheet.float:not([hidden]) .wrap{animation:pop .2s ease-out}@keyframes pop{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
.x{border:0;background:var(--line);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:20px;line-height:1}
/* form */
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;width:100%;min-width:0}
.field input.num{font-family:var(--f-num)}
.field .hint{font-size:12.5px;color:var(--ink-3)}
.field.bad input{border-color:var(--down)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tps{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px 10px;align-items:center}
.tps .h{font-size:12px;color:var(--ink-3);font-weight:600}
.tps input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;width:100%;min-width:0;font-family:var(--f-num)}
.outs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.outs button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 4px;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.outs button small{font-family:var(--f-num);font-weight:500;font-size:11.5px;color:var(--ink-3)}
.outs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.outs button[aria-pressed="true"] small{color:var(--accent)}
.preview .kv .v{font-family:var(--f-num)}
.tplist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.tplist div{background:var(--bg);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tplist .num{font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.err{color:var(--down);font-size:13.5px;font-weight:600}
textarea.io{font-family:var(--f-num);font-size:12px;min-height:140px}
.confirm{display:flex;gap:8px}
.sec{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:0;cursor:pointer}
.linkbtn:disabled{color:var(--ink-3)}
a.btn{display:block;text-align:center;text-decoration:none}
.exn{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase}
.live{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.search{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;width:100%}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.mrow:first-child{border-top:0}
.mrow:active{background:var(--bg)}
.mrow .pair{font-weight:600}
.mrow .px{text-align:right;font-weight:500}
.rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.rates div{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rates .num{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rates div.on{outline:2px solid var(--accent);outline-offset:-2px}
.acct{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.acct:first-of-type{border-top:0}
.acct .n{font-weight:600}
.acct .s{font-size:12.5px;color:var(--ink-3)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:0 0 26px;width:26px;height:26px;margin:0;border:2px solid var(--ink-3);border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.toggle input[type=checkbox]::after{content:"";width:6px;height:12px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:translateY(-1.5px) rotate(45deg);opacity:0}
.toggle input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.toggle input[type=checkbox]:checked::after{opacity:1}
.steps{margin:0;padding-left:20px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:6px}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
@keyframes fu{from{background:var(--up-soft)}to{background:transparent}}
@keyframes fd{from{background:var(--down-soft)}to{background:transparent}}
.px.fu{animation:fu 1.2s ease-out;color:var(--up)} .px.fd{animation:fd 1.2s ease-out;color:var(--down)}
.px{border-radius:4px;padding:0 3px}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px;vertical-align:1px}
@media (prefers-reduced-motion:no-preference){.livedot{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
.savebar{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.savebar [data-dirty]{color:var(--warn);font-size:13px;font-weight:600}
.savebar .btn:disabled{background:var(--line);color:var(--ink-3);cursor:default}
.sugg{margin-top:-6px;max-height:300px;overflow-y:auto}
.sugg .mrow{padding:11px 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:20}
@media (max-width:360px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .bal{font-size:32px}}
@media (prefers-reduced-motion:no-preference){.sheet:not([hidden]){animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<main id="view" class="wrap"></main>
<button id="fab" class="fab" hidden>+ New trade</button>
<nav class="tabs"><div class="in" role="tablist">
  <button id="t-dash" role="tab" data-tab="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-4 3 3 5-6"/></svg>Dashboard</button>

  <button id="t-markets" role="tab" data-tab="markets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M6 8h-2v6h2M12 6v12M12 9h-2v5h2M18 3v15M18 6h-2v8h2"/></svg>Markets</button>

// Network: on Android the app makes the request natively (no browser restrictions); elsewhere it uses fetch.
const pending = {}; let reqN = 0;

function httpGet(url){ return new Promise((res,rej)=>{
  if(Native && Native.httpGet){ const id="r"+(++reqN); pending[id]={res,rej};
    try{ Native.httpGet(id,url); }catch(e){ delete pending[id]; rej(e); return; }
    setTimeout(()=>{ if(pending[id]){ delete pending[id]; rej(new Error("No answer within 20 seconds")); } }, 20000);
  } else fetch(url).then(r=>r.ok?r.text():Promise.reject(new Error("HTTP "+r.status))).then(res,rej);
}); }
function httpPost(url, json){ return new Promise((res,rej)=>{

}); }
function privateGet(ex, kind){ return new Promise((res,rej)=>{

async function p2pQuote(ex, fiat){

    if(!keyInfo("mexc")) throw new Error("Connect your MEXC account to get MEXC's USDT price.");
    try{ q=await mexcRate(fiat); }
    catch(e){ throw new Error(/rejected|permission|401|403|700|10072/i.test(String(e.message)) ? "MEXC refused: tick P2P → Read on your MEXC API key, then try again." : String(e.message||e)); }
  } else {
    const f = ex==="binance" ? [s=>p2pSide(fiat,s), "BUY", "SELL"] : ex==="okx" ? [s=>okxP2P(fiat,s), "sell", "buy"] : [s=>bybitP2P(fiat,s), "1", "0"];
    const [buy, sell] = await Promise.all([f[0](f[1]).catch(()=>null), f[0](f[2]).catch(()=>null)]);
    q={ref:0, buy:buy||0, sell:sell||0};
  }
  const rate = q.ref>0 ? q.ref : (q.buy>0&&q.sell>0 ? (q.buy+q.sell)/2 : (q.buy||q.sell));

}

  if(S.ignoreOpen) Object.keys(S.ignoreOpen).forEach(k=>{ if(k.startsWith(ex+"|") && !seen.has(k)){ delete S.ignoreOpen[k]; changed=true; } });
  // positions that are gone from the exchange: close the logged trade with the exchange's realised P&L
  for(const t of S.trades.filter(t=>!t.outcome && t.posKey && t.posKey.startsWith(ex+"|") && !seen.has(t.posKey))){
    if(!t.goneAt){ t.goneAt=now; changed=true; }
    let h=null; try{ h=await closedFor(ex,t); }catch(e){}
    if(!h) continue; // not on record yet; try again next sync
    const pnl=h.pnl, exit=h.exit;
    t.pnlUsd=+pnl.toFixed(4); t.exitPrice=exit||null; t.closedAt=h.at||now; t.sizeNow=0; delete t.goneAt;
    if(h.entry) t.entry=h.entry;
    if(ex==="mexc"){ try{ const id=t.posKey.split("|")[1]; applyFills(t, await mexcFills(t.sym, id, t.created)); }catch(e){} }
    classify(t);
    changed=true;
    if(typeof toast==="function") toast(`${pairLabel(t.pair)} closed on ${name} · ${smoney(pnl)} USDT`);
  }
  if(ex==="mexc" && addNew){ if(await importMexcHistory()) changed=true; if(await backfillMexcFills()) changed=true; }
  if(changed) persist();
}

async function livePrice(ex, market, pair){
  const e=EX[ex], x=splitPair(pair); if(!e||!x) throw new Error("Pick an exchange and pair.");
  const m=e[market]||e.spot; let v;
  try{ v=parseFloat(m.pick(JSON.parse(await httpGet(m.api(x.b,x.q))))); }catch(err){ v=NaN; }
  if(!(v>0)){ // main address blocked or slow: use the full price list (which has backup addresses)
    try{ const r=(await allPairs(ex, market)).find(r=>r.b===x.b && r.q===x.q); if(r) v=r.p; }catch(err){} }
  if(!(v>0)) throw new Error(`${x.b}/${x.q} wasn't found on ${e.name} ${mktLabel(market)}.`);
  return v;
}
const live = {}; // "ex|market|pair" -> {p, at}
const liveKey = t => `${t.ex}|${t.market}|${splitPair(t.pair)?.b}${splitPair(t.pair)?.q}`;
async function refreshLive(trades){
  const keys={}; trades.filter(t=>!t.outcome && t.ex && EX[t.ex]).forEach(t=>{ const k=liveKey(t); if(!live[k] || Date.now()-live[k].at>2500) keys[k]=t; });
  await Promise.all(Object.entries(keys).map(async([k,t])=>{ try{ live[k]={p:await livePrice(t.ex,t.market,t.pair), at:Date.now()}; }catch(e){} }));
  return Object.keys(keys).length>0;
}
// Leverage: margin = position value ÷ leverage. Liquidation is an estimate for isolated margin with a
// maintenance margin rate (mmr); exchanges use tiered rates, so treat it as approximate.
function levInfo(entry, sl, dir, value, lev, mmr){
  lev=Math.max(1,Number(lev)||1); const m=(Number(mmr)||0)/100;
  const liq = dir==="Short" ? entry*(1+1/lev-m) : entry*(1-1/lev+m);
  const stopPct = Math.abs(entry-sl)/entry;
  const maxLev = Math.max(1, Math.floor(1/(stopPct+m) * 0.9)); // 10% buffer so the stop fills before liquidation
  const liqFirst = dir==="Short" ? liq <= sl : liq >= sl;
  return { lev, margin:value/lev, liq: lev>1? liq : null, maxLev, liqFirst: lev>1 && liqFirst, tooHigh: lev>maxLev };
}
const banked = t => (t.fills||[]).filter(f=>f.kind==="close").reduce((s,f)=>s+f.pnl,0); // profit already taken by partial closes
const stopR = (t, p) => { const sl=t.sl0||t.sl; return sl && Math.abs(t.entry-sl)>0 ? (p - t.entry) / (t.entry - sl) : null; };
const openPnl = (t, p) => t.sizeNow ? banked(t) + (p - t.entry) * t.sizeNow * (t.dir==="Short"?-1:1) : (stopR(t,p)!=null && t.riskUsd>0 ? stopR(t,p)*t.riskUsd : null);
const openR = (t, p) => { const u=openPnl(t,p); return t.riskUsd>0 && u!=null ? u/t.riskUsd : stopR(t,p); }; // works for long and short
function liveTxt(t, p){ const r=openR(t,p), u=openPnl(t,p); return r!=null ? {cls:cls(r), txt:"now "+R(r)} : u!=null ? {cls:cls(u), txt:"now "+smoney(u)} : {cls:"", txt:""}; }

/* ---------- math (same rules as the Excel tracker) ---------- */
const OUTS = ["SL","BE","TP1","TP2","TP3","TP4"];
function rFor(outcome, manualR, st){
  st = st || S.settings;
  if(outcome==="Manual") return Number(manualR)||0;
  if(outcome==="SL") return -1;
  if(outcome==="BE") return 0;
  const n = {TP1:1,TP2:2,TP3:3,TP4:4}[outcome]; if(!n) return 0;
  let r=0; for(let i=0;i<n;i++) r += st.tps[i].r * st.tps[i].pct/100; return r;
}
function tpPrice(entry, sl, dir, r){ const d=Math.abs(entry-sl); return entry + (dir==="Short"?-1:1)*r*d; }
function closedSorted(trades){ return trades.filter(t=>t.outcome).sort((a,b)=>(a.closedAt-b.closedAt)||(a.created-b.created)); }

function compute(st, trades){
  const sc = st.startCap && st.startCap[st.tradeEx||"mexc"];
  const cap = sc ? sc.amt : Number(st.capital)||0;
  const closed = closedSorted(trades);
  let bal=cap, peak=cap, maxDD=0, streak=0, maxStreak=0, wins=0, losses=0, be=0, sumR=0, gW=0, gL=0, sumWinR=0, sumLossR=0;
  const curve=[{bal:cap,label:"Start"}];
  for(const t of closed){
    const real = t.pnlUsd!=null; // closed on the exchange: use its realised P&L
    const R = real ? (t.riskUsd>0 ? t.pnlUsd/t.riskUsd : 0) : rFor(t.outcome, t.manualR, st);
    const pnl = real ? t.pnlUsd - (t.auto ? 0 : (Number(t.fees)||0)) : R*t.riskUsd - (Number(t.fees)||0);
    t._R=R; t._pnl=pnl;
    bal+=pnl; peak=Math.max(peak,bal); if(peak>0) maxDD=Math.max(maxDD,1-bal/peak);
    sumR+=R;
    const sgn = real ? pnl : R;
    if(sgn>0){wins++; gW+=Math.max(R,0); sumWinR+=R; streak=0;} else if(sgn<0){losses++; gL+=-Math.min(R,0); sumLossR+=R; streak++; maxStreak=Math.max(maxStreak,streak);} else be++;
    curve.push({bal, label:pairLabel(t.pair)+" · "+t.outcome});
  }
  // Connected: risk is a % of the active exchange's futures balance, and the brake watches that balance's own peak.
  const exBal = exTotal(), x = exBal!=null && typeof S!=="undefined" && S ? exRisk(tradeEx()) : null;
  const dd = x ? x.dd : (peak>0 ? Math.max(0,1-bal/peak) : 0);
  const brake = dd >= st.brakeDD/100;
  const nextPct = st.riskPct * (brake ? st.brakeMult/100 : 1);
  const base = x ? Math.max(exBal,0) : Math.max(bal,0);
  const nextUsd = base*nextPct/100;
  const open = trades.filter(t=>!t.outcome);
  const openRisk = open.reduce((s,t)=>s+(Number(t.riskUsd)||0),0);
  // TP funnel (manual exits excluded)
  const tagged = closed.filter(t=>t.outcome!=="Manual");
  const idx = o => OUTS.indexOf(o); // TP1=2..TP4=5
  const reach = [2,3,4,5].map(k=>tagged.filter(t=>idx(t.outcome)>=k).length);
  const funnel = reach.map((c,i)=>({c, rate: (i===0 ? (tagged.length? c/tagged.length : null) : (reach[i-1]? c/reach[i-1] : null))}));
  const tpTrades = tagged.filter(t=>idx(t.outcome)>=2);
  const avgTpR = tpTrades.length ? tpTrades.reduce((s,t)=>s+t._R,0)/tpTrades.length : null;
  const beRate = avgTpR ? 1/(1+avgTpR) : null;
  // same trades under both sizing methods
  const sim = mode => { let b=cap,p=cap,md=0; for(const t of closed){ const d=p>0?1-b/p:0; const pct=st.riskPct*(d>=st.brakeDD/100?st.brakeMult/100:1); const risk=(mode==="flat"?cap:Math.max(b,0))*pct/100; b+=t._R*risk-(Number(t.fees)||0); p=Math.max(p,b); if(p>0) md=Math.max(md,1-b/p);} return {bal:b,dd:md}; };
  return { cap, bal, peak, dd, maxDD, brake, nextPct, nextUsd, exBal, open, openRisk, closed, curve,
    n:closed.length, wins, losses, be, winRate: closed.length? wins/closed.length : null,
    expR: closed.length? sumR/closed.length : null, totalR:sumR, pf: gL? gW/gL : (gW? Infinity : null),
    avgWin: wins? sumWinR/wins : null, avgLoss: losses? sumLossR/losses : null, maxStreak,
    funnel, taggedN:tagged.length, avgTpR, beRate, comp: st.mode==="flat"? sim("compound") : {bal, dd:maxDD}, flat: st.mode==="flat"? {bal, dd:maxDD} : sim("flat") };
}

const money = v => (v<0?"−":"") + nf2.format(Math.abs(v));
const smoney = v => (v>0?"+":v<0?"−":"") + nf2.format(Math.abs(v));
const pct = (v,d=1) => v==null ? "—" : (v*100).toFixed(d)+"%";
const R = v => v==null ? "—" : (v>0?"+":v<0?"−":"") + Math.abs(v).toFixed(2)+"R";
function price(p){ if(!isFinite(p)) return "—"; const a=Math.abs(p); const d = a>=1000?2 : a>=1?4 : a>=0.01?6 : 8; return p.toLocaleString("en-US",{minimumFractionDigits:Math.min(d,2),maximumFractionDigits:d}); }
function units(u){ if(!isFinite(u)) return "—"; const a=Math.abs(u); const d = a>=100?2 : a>=1?4 : 6; return u.toLocaleString("en-US",{maximumFractionDigits:d}); }

function drawSpark(c){
  const el=$("spark"); if(!el) return;
  const pts=c.curve; const W=el.clientWidth||340, H=el.clientHeight||96, pad=6;
  if(pts.length<2){ el.innerHTML=`<div style="color:var(--ink-3);font-size:13px;padding-top:30px">Your equity curve appears after the first closed trade.</div>`; return; }
  const vals=pts.map(p=>p.bal); let lo=Math.min(...vals), hi=Math.max(...vals); if(hi===lo){hi+=1;lo-=1;}
  const x=i=>pad+i*(W-2*pad)/(pts.length-1), y=v=>pad+(hi-v)*(H-2*pad)/(hi-lo);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.bal).toFixed(1)}`).join("");
  const area=line+`L${x(pts.length-1).toFixed(1)},${H}L${x(0).toFixed(1)},${H}Z`;

    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-dasharray="3 4" stroke-width="1"/>
    <path d="${area}" fill="url(#ga)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="hx" x1="0" x2="0" y1="0" y2="${H}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"/>

    <circle cx="${x(pts.length-1)}" cy="${y(c.bal)}" r="4.5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
  </svg><div class="tip num" id="htip" hidden></div>`;
  const svg=el.querySelector("svg"), hx=el.querySelector("#hx"), hd=el.querySelector("#hd"), tip=el.querySelector("#htip");
  const move=ev=>{ const r=svg.getBoundingClientRect(); const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;

// Settings: changes stay on screen until you tap that section's Save.
function bindSettings(){
  const st=S.settings;
  const markDirty = card => { if(!card) return; card.querySelector("[data-dirty]").hidden=false; card.querySelector("[data-save]").disabled=false; card.querySelector("[data-saveerr]").hidden=true; };
  document.querySelectorAll("[data-card]").forEach(card=>{
    card.addEventListener("input", e=>{ if(e.target.matches("input,select")) markDirty(card); });
    card.addEventListener("change", e=>{ if(e.target.matches("input,select")) markDirty(card); });
  });
  // choice buttons only change on screen until saved
  const segPick = (id, attr) => { const el=$(id); if(!el) return; el.addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b || !b.hasAttribute(attr)) return;
    el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); markDirty(el.closest("[data-card]")); }); };
  segPick("s-theme","data-theme-set");
  segPick("s-tradeex","data-tex");
  const texHint=()=>{ const b=$("s-tradeex").querySelector('[aria-pressed="true"]'), k=b? b.dataset.tex : tradeEx(), n=EX[k].name;
    document.querySelectorAll("[data-exname]").forEach(el=>el.textContent=n);
    $("s-texhint").innerHTML = keyInfo(k) ? `Your balance, risk, positions, leverage, prices and USDT rate come from ${n} futures.` : `<span style="color:var(--warn)">${n} isn't connected yet. Connect it below so its positions are logged.</span>`; };
  $("s-tradeex").addEventListener("click", texHint); texHint();
  // live check of the TP total while typing
  document.querySelectorAll("[data-save]").forEach(btn=>btn.addEventListener("click",()=>{
    const card=btn.closest("[data-card]"), err=card.querySelector("[data-saveerr]");
    const fail=m=>{ err.hidden=false; err.textContent=m; };
    const n=id=>parseFloat($(id).value);
    const name=btn.dataset.save;
    if(name==="account"){
      const risk=n("s-risk"), cur=($("s-currency").value||"USDT").trim().toUpperCase().slice(0,8);
      if(!(risk>0 && risk<=100)) return fail("Risk per trade must be between 0 and 100%.");
      if(cur!==st.currency){ st.secondRate=null; st.rateAt=null; }
      st.riskPct=risk; st.currency=cur;
    } else if(name==="appearance"){
      const b=$("s-theme").querySelector('[aria-pressed="true"]'); st.theme=b? b.dataset.themeSet : "system"; applyTheme();
    } else if(name==="second"){
      const sec=($("s-sec").value||"").trim().toUpperCase().replace(/[^A-Z]/g,"").slice(0,5), rate=n("s-rate");
      if($("s-rate").value.trim()!=="" && !(rate>0)) return fail("The rate must be a number above 0, or empty.");
      const secChanged = sec!==st.secondCur;
      st.secondCur=sec;
      if(secChanged){ st.secondRate=null; st.rateAt=null; } else if(rate>0 && rate!==st.secondRate){ st.secondRate=rate; st.rateAt=null; st.rateFrom="Typed by you"; }
      if(!sec){ st.secondRate=null; }
      persist(); render(); toast("Saved"); if(secChanged && sec) doUpdateRate(); return;
    } else if(name==="accounts"){
      const b=$("s-tradeex").querySelector('[aria-pressed="true"]'), tex=b? b.dataset.tex : tradeEx(), switched = tex!==tradeEx(), autoLog=$("s-autolog").checked;
      const apply=()=>{ st.autoLog=autoLog; st.tradeEx=tex;
        if(switched){ ui.mk=null; if(!/^Typed/.test(st.rateFrom||"")){ st.secondRate=null; st.rateAt=null; } }
        if(st.autoLog || switched) setTimeout(()=>syncAccounts().then(()=>render()),100);
        if(switched && st.secondCur && !st.secondRate) setTimeout(loadRate,200); };
      // Changing exchange: record its starting capital before the switch happens.
      if(switched){ capitalPrompt(tex, ()=>{ apply(); persist(); render(); toast(`Trading on ${EX[tex].name} now`); }); return; }
      apply();
    } else if(name==="brake"){
      const dd=n("s-dd"), mult=n("s-mult");
      if(!(dd>0 && dd<100)) return fail("Trigger must be between 0 and 100%.");
      if(!(mult>0 && mult<=100)) return fail("Risk while on must be between 0 and 100%.");
      st.brakeDD=dd; st.brakeMult=mult;
    }
    persist(); render(); toast("Saved");
  }));
}

  else if(dir==="Short" && sl<=entry) err="For a short, the stop loss must be above entry.";
  else if(Math.abs(entry-sl)/entry > 0.5){ const fix=stopFix(entry, sl, dir);

/* ---------- Excel export: a small .xlsx writer (no library, works offline) ---------- */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = b => { let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function zipStore(files){ // [{name, data:Uint8Array}] → Uint8Array (stored, no compression)
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=v=>[v&255,(v>>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for(const f of files){ const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const head=[...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)];
    parts.push(new Uint8Array(head), nm, f.data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]), nm);
    off+=head.length+nm.length+sz; }
  const cdSize=central.reduce((s,p)=>s+p.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  const all=[...parts,...central,end], out=new Uint8Array(all.reduce((s,p)=>s+p.length,0)); let p=0; all.forEach(a=>{ out.set(a,p); p+=a.length; }); return out;
}
// sheets: [{name, cols:[width...], rows:[[cell...]]}]; a cell is a string, a number, null, or {v, s} (s: 1 bold header, 2 money, 3 price, 4 percent, 5 bold label)
function buildXlsx(sheets){
  const x=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
  const col=i=>{ let s=""; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; };
  const sheetXml=sh=>{ const rows=sh.rows.map((r,ri)=>`<row r="${ri+1}">${r.map((c,ci)=>{ if(c==null || c==="") return ""; const o=(typeof c==="object")? c : {v:c}; const ref=col(ci)+(ri+1), st=o.s?` s="${o.s}"`:"";
      return typeof o.v==="number" && isFinite(o.v) ? `<c r="${ref}"${st}><v>${o.v}</v></c>` : `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${x(o.v)}</t></is></c>`; }).join("")}</row>`).join("");
    const cols=sh.cols? `<cols>${sh.cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols>` : "";

  const enc=new TextEncoder(), f=(name,s)=>({name, data:enc.encode(s)});
  const files=[
    f("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`),
    f("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`),

// Swipe left / right anywhere on a tab to move to the next / previous tab, in bottom-bar order.
(function swipeTabs(){
  const view=$("view"), order=()=>[...document.querySelectorAll("nav.tabs button")].map(b=>b.dataset.tab);
  let x0=null, y0=0, t0=0, dx=0, mode=null;
  // not on the chart (it scrubs sideways), and not on a field you're typing in (so the cursor can move)
  const skip=el=>el.closest("#spark, .levchips, #n-sugg") || (el.matches("input, textarea, select") && el===document.activeElement);
  document.addEventListener("touchstart", e=>{
    if(!$("sheet").hidden || e.touches.length!==1 || skip(e.target)){ x0=null; return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); dx=0; mode=null; }, {passive:true});
  document.addEventListener("touchmove", e=>{
    if(x0==null) return;
    const mx=e.touches[0].clientX-x0, my=e.touches[0].clientY-y0;
    if(!mode){ if(Math.abs(mx)<12 && Math.abs(my)<12) return; mode = Math.abs(mx)>Math.abs(my)*1.3 ? "x" : "y"; if(mode==="x") view.classList.remove("swipe-anim","ptr-back"); }
    if(mode!=="x") return;
    const list=order(), i=list.indexOf(ui.tab), edge=(mx>0 && i===0) || (mx<0 && i===list.length-1);
    dx = edge ? mx*0.25 : mx; view.style.transform=`translateX(${dx}px)`; }, {passive:true});
  const end=()=>{
    if(x0==null || mode!=="x"){ x0=null; return; } x0=null;
    const list=order(), i=list.indexOf(ui.tab), fast=Math.abs(dx)/Math.max(1,Date.now()-t0) > 0.5;
    const j = (dx<-70 || (fast && dx<-30)) ? i+1 : (dx>70 || (fast && dx>30)) ? i-1 : i;
    view.classList.add("swipe-anim");
    if(j===i || j<0 || j>=list.length){ view.style.transform=""; setTimeout(()=>view.classList.remove("swipe-anim"),220); return; }
    const dir = j>i ? -1 : 1, w=window.innerWidth;
    view.style.transform=`translateX(${dir*w}px)`; view.style.opacity="0";
    setTimeout(()=>{
      view.classList.remove("swipe-anim"); goTab(list[j]);
      view.style.transform=`translateX(${-dir*w*0.35}px)`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ view.classList.add("swipe-anim"); view.style.transform=""; view.style.opacity="";
        setTimeout(()=>view.classList.remove("swipe-anim"),220); }));
    }, 180);
  };
  document.addEventListener("touchend", end, {passive:true});
  document.addEventListener("touchcancel", ()=>{ if(x0!=null){ x0=null; view.classList.add("swipe-anim"); view.style.transform=""; } }, {passive:true});
})();

(function dedupe(){
  const score=t=>(t.fills?t.fills.length*10:0)+(t.outcome?5:0)+(t.note&&!/^From /.test(t.note)?3:0)+(t.riskEst?0:1);
  const keep=new Map(), drop=new Set();
  S.trades.forEach(t=>{ if(!t.posKey) return;
    // an exchange position is one trade; a reopened Binance/Bybit symbol gets a new entry only after the old one closed
    const k=t.posKey+"|"+(t.posKey.startsWith("mexc|")||t.posKey.startsWith("okx|") ? "" : (t.closedAt? Math.round(t.closedAt/60000) : "open"));
    const prev=keep.get(k); if(!prev){ keep.set(k,t); return; }
    if(score(t)>score(prev)){ drop.add(prev.id); keep.set(k,t); } else drop.add(t.id); });
  if(drop.size){ S.trades=S.trades.filter(t=>!drop.has(t.id)); S.dedupedAt=Date.now(); }
})();

}
function paintLive(){
  document.querySelectorAll("[data-lv]").forEach(el=>{ const t=S.trades.find(x=>x.id===el.dataset.lv); const lv=t&&live[liveKey(t)]; if(!lv) return;
    const x=liveTxt(t,lv.p); el.className="sub rt num "+x.cls; el.textContent=x.txt; });
  if(document.querySelector("[data-pu]")){ const a=accounts(); const list=connectedEx().flatMap(k=>(a[k].positions||[]));
    document.querySelectorAll("[data-pu]").forEach(el=>{ const p=list[+el.dataset.pu]; if(!p||p.upnl==null) return; el.className="r num "+cls(p.upnl); el.textContent=smoney(p.upnl); }); }
  const tl=$("t-live"); if(tl && ui.sheet && ui.sheet.kind==="trade"){ const t=S.trades.find(x=>x.id===ui.sheet.id); const lv=t&&live[liveKey(t)];
    if(lv){ const r=openR(t,lv.p), u=openPnl(t,lv.p); tl.querySelector(".v").innerHTML=`${price(lv.p)} · <span class="${cls(u??r)}">${r!=null?R(r)+" ":""}(${u!=null?smoney(u):"—"})</span><br><span style="font-size:11.5px;color:var(--ink-3);font-family:var(--f-ui)"><span class="livedot"></span>${new Date(lv.at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})}</span>`; } }
}
let ticking=false;
async function tick(){
  if(ticking || !Native || document.hidden) return; ticking=true;
  try{
    const sheetOpen=!$("sheet").hidden;
    if(!sheetOpen && ui.tab==="markets") await loadMarkets(false);
    else if(!sheetOpen && ui.tab==="trades"){ await Promise.all([refreshLive(S.trades), refreshPositions()]); paintLive(); }
    else if(sheetOpen && ui.sheet && ui.sheet.kind==="trade"){ await refreshLive(S.trades.filter(t=>t.id===ui.sheet.id)); paintLive(); }
  }catch(e){} finally{ ticking=false; }
}
setInterval(tick, 3000);
let mirrorBusy=false;
setInterval(async()=>{ if(mirrorBusy || !Native || document.hidden || !syncList().length) return; mirrorBusy=true;
  try{ const before=JSON.stringify(S.trades.map(t=>[t.id,t.outcome,t.sl,t.sizeNow,t.entry,t.lev,t.tpHits])); await syncAccounts();
    if(before!==JSON.stringify(S.trades.map(t=>[t.id,t.outcome,t.sl,t.sizeNow,t.entry,t.lev,t.tpHits])) && $("sheet").hidden && ui.tab!=="settings") render(); }
  catch(e){} finally{ mirrorBusy=false; } }, 20000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tick(); });

// Pull down from the top of any tab to refresh: balances, positions and trades from the exchange,
// plus prices on Markets and the USDT rate.
(function pullToRefresh(){
  const el=$("ptr"), view=$("view"), arc=el.querySelector(".arc"), lbl=el.querySelector(".lbl");
  const PULL=80, MAX=130, HOLD=72, C=69.1; let y0=null, x0=0, d=0, busy=false;
  const place=(h,progress)=>{ view.style.transform = h>0 ? `translateY(${h}px)` : ""; el.style.height=h+"px";
    if(progress!=null) arc.setAttribute("stroke-dashoffset", String(C*(1-Math.min(progress,1)))); };
  const back=()=>{ view.classList.add("ptr-back"); el.classList.remove("ready","spin"); place(0,0);
    setTimeout(()=>{ view.classList.remove("ptr-back"); lbl.textContent="Pull to refresh"; }, 340); };
  document.addEventListener("touchstart", e=>{
    if(busy || !$("sheet").hidden || window.scrollY>0 || e.touches.length!==1 || e.target.closest("#spark")) { y0=null; return; }
    y0=e.touches[0].clientY; x0=e.touches[0].clientX; d=0; view.classList.remove("ptr-back"); }, {passive:true});
  document.addEventListener("touchmove", e=>{
    if(y0==null) return;
    const dy=e.touches[0].clientY-y0, dx=e.touches[0].clientX-x0;
    if(d===0 && Math.abs(dx)>Math.abs(dy)){ y0=null; return; } // sideways: that's a tab swipe
    if(dy<=0 || window.scrollY>0){ if(d>0){ d=0; place(0,0); } return; }
    d=Math.min(dy*0.55, MAX); const ready=d>=PULL;
    if(ready!==el.classList.contains("ready")){ el.classList.toggle("ready", ready); lbl.textContent = ready ? "Release to refresh" : "Pull to refresh"; }
    place(d, d/PULL); }, {passive:true});
  const end=async()=>{
    if(y0==null) return; y0=null;
    if(d<PULL){ back(); return; }
    busy=true; view.classList.add("ptr-back"); el.classList.remove("ready"); el.classList.add("spin"); lbl.textContent="Refreshing…"; place(HOLD, null);
    let msg="Updated";
    try{
      if(!Native) msg="Live data works in the Android app.";
      else{
        const jobs=[];
        if(syncList().length) jobs.push(syncAccounts().then(errs=>{ if(errs && errs.length) msg=errs[0]; }));
        if(ui.tab==="markets") jobs.push(loadMarkets(true));
        if(ui.tab==="trades") jobs.push(refreshLive(S.trades));
        if(S.settings.secondCur && !/^Typed/.test(S.settings.rateFrom||"")) jobs.push(updateRate().then(()=>{ S.settings.rateErr=null; }).catch(e=>{ S.settings.rateErr=String(e.message||e); }));
        await Promise.allSettled(jobs);
      }
    }finally{ busy=false; if($("sheet").hidden && !unsavedSettings()) render(); back(); toast(msg); }
  };
  document.addEventListener("touchend", end, {passive:true});
  document.addEventListener("touchcancel", ()=>{ if(y0!=null && !busy){ y0=null; back(); } }, {passive:true});
})();
</script>
